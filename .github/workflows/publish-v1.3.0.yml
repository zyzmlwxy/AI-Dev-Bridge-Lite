name: Publish AI Dev Bridge Lite v1.3.0 (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.3.0.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'zyzmlwxy/AI-Dev-Bridge-Lite'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish exact-source-commit tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: bb675c5d760821f6edf58c90e782602ee37b553a
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GH_REPO}/commits/${TARGET_SHA}" --jq '.sha')" = "$TARGET_SHA"
          if gh release view v1.3.0 -R "$GH_REPO" >/dev/null 2>&1; then
            echo 'Release v1.3.0 already exists; refusing to replace it.'
            exit 0
          fi
          if gh api "repos/${GH_REPO}/git/ref/tags/v1.3.0" >/dev/null 2>&1; then
            echo 'Tag v1.3.0 exists without Release; refusing to overwrite or retarget it.'
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## AI Dev Bridge Lite v1.3.0

          **Optional read-only GitHub Actions preflight for WorkBuddy execution reports and tested Git SHAs.**

          ### New in v1.3.0
          - `WAITING_FOR_REPORT` while no immutable execution report exists; never treated as test PASS.
          - `EVIDENCE_READY` when report metadata, exact tested SHA, attempt number, recorded results/exit codes and Git report-only ancestry are structurally consistent.
          - `EVIDENCE_INVALID` for contradictory Build/Tests evidence, forged SHA, non-ancestor report, or substantive changes after the tested source commit.
          - Improved Windows CRLF support and build-only tasks where `Tests: N/A` is legitimate.
          - Portable opt-in workflow and Python standard-library script: `contents: read`, `pull-requests: read`, no write token or additional service. The repository-only unit test suite is optional when installing the two runtime files in another project.
          - Retains v1.2.0 `CODE_READY`/`REVIEW_PENDING` GitHub PR comments and the v1.1 standalone `AGENTS.md` manual handoff.

          ### Real tests and limitations
          - WorkBuddy Attempt 2 on Windows 11 / Python 3.13.14: syntax check exit 0, 33/33 V1.3 evidence tests exit 0, 18/18 V1.2 compatibility tests exit 0.
          - GitHub compare confirmed a report-only commit after WorkBuddy's tested SHA. GitHub Actions actually logged `EVIDENCE_READY` for Attempt 2 and posted a `REVIEW_PENDING` bot comment.
          - Four original code-review issues were fixed, regression-tested and resolved. Later source-branch changes after testing were only the separate report commit and release documentation.
          - Evidence preflight checks metadata and Git lineage; it does **not** prove the honesty of a test report or launch WorkBuddy/ChatGPT. No general project build, production deployment, auto-merge, or autonomous agent wakeup was verified.

          ### References
          - [Development PR #11 and final acceptance](https://github.com/zyzmlwxy/AI-Dev-Bridge-Lite/pull/11#issuecomment-6409808855)
          - [Issue #10](https://github.com/zyzmlwxy/AI-Dev-Bridge-Lite/issues/10)
          - [Changelog](https://github.com/zyzmlwxy/AI-Dev-Bridge-Lite/blob/main/CHANGELOG.md)
          NOTES
          gh release create v1.3.0 --repo "$GH_REPO" --target "$TARGET_SHA" --title 'AI Dev Bridge Lite v1.3.0' --notes-file release-notes.md --latest
          echo "Published v1.3.0 exactly at $TARGET_SHA"

name: Publish AI Dev Bridge Lite v1.2.0 (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.2.0.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'zyzmlwxy/AI-Dev-Bridge-Lite'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish exact-commit tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: 508fbe5908d014ae6ea1ca69e5a63f1c594514b9
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GH_REPO}/commits/${TARGET_SHA}" --jq '.sha')" = "$TARGET_SHA"
          if gh release view v1.2.0 -R "$GH_REPO" >/dev/null 2>&1; then
            echo 'Release v1.2.0 already exists; refusing to change it.'
            exit 0
          fi
          if gh api "repos/${GH_REPO}/git/ref/tags/v1.2.0" >/dev/null 2>&1; then
            echo 'Tag v1.2.0 already exists without a published release; refusing to overwrite it.'
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## AI Dev Bridge Lite v1.2.0

          **GitHub-native, optional PR handoff notifications for ChatGPT and WorkBuddy.**

          ### Highlights
          - Optional GitHub Actions `CODE_READY` comment for an eligible same-repository, non-draft PR, guiding WorkBuddy to the PR and exact head SHA.
          - Optional `REVIEW_PENDING` comment when a push adds only correctly named immutable execution reports, guiding ChatGPT to independent review.
          - Idempotent comments per notification kind and full SHA; no automatic tests-pass claim and no autonomous agent startup.
          - Maintains the portable single-file `AGENTS.md` / V1.1 manual handoff mode, without requiring a daemon, external webhook receiver or personal access token.
          - GitHub workflow uses scoped `contents: read`, `issues: write`, `pull-requests: write`; the latter was approved for this workflow only.

          ### Real validation
          - WorkBuddy Attempt 2 on Windows 11 / Python 3.13.14: syntax validation and 18/18 offline unit tests PASS.
          - GitHub-hosted Python syntax and 18/18 unit tests PASS.
          - Verified actual `github-actions[bot]` `CODE_READY` and `REVIEW_PENDING` comments on PR #7; actual same-SHA duplicate suppressed.
          - GitHub compare confirmed the WorkBuddy report commit only added its immutable report file after the tested source SHA.

          **Scope:** This release confirms GitHub comment notifications and user-triggered AI handoffs. It does *not* automatically launch AI agents, perform production deployment, or prove arbitrary project builds.

          ### Sources
          - [Development and acceptance PR #7](https://github.com/zyzmlwxy/AI-Dev-Bridge-Lite/pull/7)
          - [Issue #6](https://github.com/zyzmlwxy/AI-Dev-Bridge-Lite/issues/6)
          - [Changelog](https://github.com/zyzmlwxy/AI-Dev-Bridge-Lite/blob/main/CHANGELOG.md)
          NOTES
          gh release create v1.2.0 --repo "$GH_REPO" --target "$TARGET_SHA" --title 'AI Dev Bridge Lite v1.2.0' --notes-file release-notes.md --latest
          echo "Published release v1.2.0 from verified release merge SHA $TARGET_SHA"
